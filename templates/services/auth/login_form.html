{% csrf_token %}
<div class="form-group">
  <label>نام کاربری، ایمیل یا شماره موبایل</label>
  <input type="text"
         name="username"
         {% if form.username.value %}value="{{ form.username.value }}"{% endif %}
         placeholder="نام کاربری خود را وارد کنید"
         class="ltr-input{% if form.username.errors %} field-error{% endif %}"
         dir="ltr"
         autocomplete="username"
         required>
  {% if form.username.errors %}<div class="field-error-msg">{{ form.username.errors.0 }}</div>{% endif %}
</div>
<div class="form-group">
  <label>رمز عبور</label>
  <input type="password"
         name="password"
         placeholder="رمز عبور خود را وارد کنید"
         class="ltr-input{% if form.password.errors %} field-error{% endif %}"
         dir="ltr"
         autocomplete="current-password"
         required>
  {% if form.password.errors %}<div class="field-error-msg">{{ form.password.errors.0 }}</div>{% endif %}
</div>
<div class="remember-me-group" style="margin-bottom:16px">
  <label class="remember-me-label">
    <input type="checkbox" name="remember_me" class="remember-me-checkbox">
    مرا به خاطر بسپار
  </label>
</div>
<button type="submit" class="btn-primary" style="width:100%">ورود</button>
<div class="register-link"
     style="margin-top:12px;
            text-align:center;
            font-size:0.85rem">
  حساب کاربری ندارید؟ <a href="{% url 'register' %}">ثبت‌نام کنید</a>
</div>
<div style="margin-top:8px;text-align:center">
  <a href="{% url 'password_reset_phone' %}" class="muted-link">رمز عبور را فراموش کرده‌اید؟</a>
</div>
