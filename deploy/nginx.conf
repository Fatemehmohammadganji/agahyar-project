# Static file server for uploaded media in production.
#
# Django never serves /media/ when DEBUG=False (see agahyar_project/urls.py),
# so a dedicated nginx sidecar exposes the uploaded files that live in the
# host's ./media directory (shared with the web container). Traefik routes
# requests under /media/ to this server; everything else stays with Django.

server {
    listen 80;
    server_name _;

    location /media/ {
        alias /usr/share/nginx/html/media/;
        access_log off;
        add_header Cache-Control "public, max-age=86400, must-revalidate";
    }

    location / {
        return 404;
    }
}
